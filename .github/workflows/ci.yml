name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test-pack:
    name: Build, test, and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FunctionalSharp/FunctionalSharp.sln

      - name: Build
        run: dotnet build FunctionalSharp/FunctionalSharp.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run tests with coverage
        run: >-
          dotnet test FunctionalSharpTests/FunctionalSharpTests.csproj
          --configuration Release --no-build --no-restore
          --logger "trx;LogFileName=tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Create NuGet and symbol packages
        run: >-
          dotnet pack FunctionalSharp/FunctionalSharp.csproj
          --configuration Release --no-build --no-restore
          -p:ContinuousIntegrationBuild=true
          --output artifacts/packages

      - name: Verify version 2 API baseline
        run: dotnet run --project tools/ApiSnapshot/ApiSnapshot.csproj --configuration Release -- --verify docs/PUBLIC-API.txt

      - name: Build and run packaged consumer examples
        shell: pwsh
        run: |
          [xml] $project = Get-Content FunctionalSharp/FunctionalSharp.csproj -Raw
          $version = [string] $project.Project.PropertyGroup.Version
          dotnet restore examples/Version2Consumer/Version2Consumer.csproj -p:FluentSharpVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project examples/Version2Consumer/Version2Consumer.csproj --configuration Release --no-restore -p:FluentSharpVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
